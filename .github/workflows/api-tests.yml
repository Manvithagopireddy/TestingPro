name: API Tests — Task Manager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual runs from GitHub Actions UI

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Create reports directory ───────────────────────────────────────────
      - name: Create reports directory
        run: mkdir -p reports

      # ── 5. Seed the database ─────────────────────────────────────────────────
      - name: Seed database
        run: node scripts/seed.js

      # ── 6. Start API server in background ────────────────────────────────────
      - name: Start API server
        run: |
          node src/server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      # ── 7. Wait for server to be ready ───────────────────────────────────────
      - name: Wait for server to be healthy
        run: |
          echo "Waiting for API server on http://127.0.0.1:3000/health ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server is healthy (attempt $i)"
              break
            fi
            echo "  Attempt $i: status=$STATUS — retrying in 1s..."
            sleep 1
          done
          # Final check — fail the step if server never responded
          curl --fail http://localhost:3000/health

      # ── 8. Run Jest test suite & code coverage ────────────────────────────────
      - name: Run Jest test suite & coverage
        run: npm run test:coverage

      # ── 8b. Run Cucumber BDD test suite ───────────────────────────────────────
      - name: Run Cucumber BDD suite
        run: npm run test:cucumber:html

      # ── 9. Run SQL validation script ──────────────────────────────────────────
      - name: Run SQL validation
        run: node scripts/sql-validation.js

      # ── 11. Upload HTML reports as artifacts ──────────────────────────────────
      - name: Upload test reports
        if: always()   # upload even if tests fail, so we can investigate
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/cucumber-report.html
            coverage/
          retention-days: 30

      # ── 12. Stop API server ───────────────────────────────────────────────────
      - name: Stop API server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" || true
            echo "Server stopped (PID $SERVER_PID)"
          fi
