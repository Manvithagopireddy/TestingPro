name: One-time Secure Dependency Lockfile Regeneration

on:
  push:
    branches:
      - security/remediate-npm-advisories

permissions:
  contents: write

jobs:
  regenerate:
    if: "contains(github.event.head_commit.message, 'Regenerate dependency lockfile in GitHub Actions')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Apply compatible advisory fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit lockfile to reviewed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore: regenerate secure npm lockfile [lock-regenerated]"
            git push origin HEAD:security/remediate-npm-advisories
          fi
      - name: Install clean from generated lock
        run: npm ci
      - name: Audit full dependency tree
        run: npm audit --audit-level=moderate
      - name: Audit runtime-only dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=moderate
