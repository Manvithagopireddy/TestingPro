name: Dependency and Repository Secret Audit

on:
  push:
    branches: [main, "quality/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit all dependencies (includes development tools)
        run: |
          mkdir -p reports
          npm audit --json --audit-level=high > reports/npm-audit-all.json
      - name: Audit runtime dependencies separately
        if: always()
        run: |
          mkdir -p reports
          npm audit --omit=dev --json --audit-level=high > reports/npm-audit-runtime.json
      - name: Publish raw audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-json
          path: reports/npm-audit-*.json
          retention-days: 30

  secrets-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan entire Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
